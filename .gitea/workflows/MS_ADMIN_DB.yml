name: "MS_ADMIN_DB"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "services/admin/db/admin.sql"

jobs:
  deploy:
    runs-on: oracle

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate schema file
        shell: bash
        run: |
          set -euo pipefail
          test -f services/admin/db/admin.sql || { echo "Missing services/admin/db/admin.sql"; exit 1; }
          echo "Schema file found"

      - name: Apply schema to admin database
        shell: bash
        run: |
          set -euo pipefail

          command -v mysqlsh >/dev/null 2>&1 || { echo "mysqlsh not found"; exit 1; }

          MYSQL_PWD=$(jq -r '.mysql_password' /etc/admin/config.json)

          echo "Applying schema to admin database..."
          MYSQLSH_PASSWORD="$MYSQL_PWD" mysqlsh service@10.0.200.50 --sql --file=services/admin/db/admin.sql

          echo "Schema applied successfully"
