name: "API_GW_TEST"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infrastructure/api_gw_test/**"

jobs:
  deploy:
    runs-on: oracle
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      AWS_REQUEST_CHECKSUM_CALCULATION: "WHEN_REQUIRED"
      AWS_RESPONSE_CHECKSUM_VALIDATION: "WHEN_REQUIRED"
      TF_VAR_region: ${{ secrets.REGION }}
      TF_VAR_tenancy_ocid: ${{ secrets.OPS_TENANCY_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OPS_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.FINGERPRINT }}
      TF_VAR_private_key: ${{ secrets.PRIVATE_KEY }}
      TF_VAR_api_gw_secret: ${{ secrets.API_GW_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Terraform Init
        run: |
          cd infrastructure/api_gw_test
          terraform init -upgrade

      - name: Terraform Plan
        run: |
          cd infrastructure/api_gw_test
          terraform plan -out=tfplan

      - name: Terraform Apply
        run: |
          cd infrastructure/api_gw_test
          terraform apply -auto-approve tfplan
          rm -f tfplan
